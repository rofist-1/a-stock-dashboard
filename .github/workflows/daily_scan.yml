name: Daily 百日新高 Scan

on:
  schedule:
    # 北京时间 15:30 = UTC 07:30 (交易日周一至周五)
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 提前启用 Node.js 24 兼容，消除弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONIOENCODING: utf-8

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python --version
          pip install --upgrade pip
          pip install akshare pandas requests openpyxl
          echo "=== pip list ==="
          pip list

      - name: Restore K-line cache
        uses: actions/cache@v4
        with:
          path: kline_cache
          key: kline-cache-${{ github.run_id }}
          restore-keys: |
            kline-cache-

      - name: Debug environment
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== Files ==="
          ls -la
          echo "=== Python ==="
          which python
          python --version
          echo "=== Disk ==="
          df -h .

      - name: Run scanner
        run: python scanner_akshare.py
        continue-on-error: false

      - name: List output files
        if: success() || failure()
        run: |
          echo "=== Output files ==="
          ls -la 百日新高_*.json 百日新高_*.csv 历史趋势 2>/dev/null || echo "(checking...)"
          ls -la 2>/dev/null || true

      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "auto: 百日新高 scan $(date +%Y-%m-%d)"
          git push
