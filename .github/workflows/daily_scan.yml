name: Daily 百日新高 Scan

on:
  schedule:
    # 北京时间 15:30 = UTC 07:30 (交易日周一至周五)
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install akshare pandas requests openpyxl

      - name: Restore K-line cache
        uses: actions/cache@v4
        with:
          path: kline_cache
          key: kline-cache-${{ github.run_id }}
          restore-keys: kline-cache-

      - name: Run scanner
        run: python scanner_akshare.py

      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "auto: 百日新高 scan $(date +%Y-%m-%d)"
          git push
