        .card .value { font-size: 20px; font-weight: bold; }
        .card .value.up { color: #e74c3c; }
        .card .value.down { color: #27ae60; }
        
        /* 主内容区域 */
        .main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .main { grid-template-columns: 1fr; } }
        
        /* 板块排行榜 */
        .sector-rank { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .sector-rank h3 { margin-bottom: 15px; font-size: 16px; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }
        .rank-item { margin-bottom: 15px; }
        .rank-item .name { font-weight: bold; font-size: 14px; }
        .rank-item .stats { font-size: 12px; color: #666; margin-top: 3px; }
        .rank-item .sub { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
        .rank-item .sub span { background: #e8f0fe; color: #1a73e8; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
        
        /* 趋势图 */
        .chart-box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .chart-box h3 { margin-bottom: 10px; font-size: 16px; }
        .chart-container { width: 100%; height: 200px; position: relative; }
        #trendChart { width: 100%; height: 100%; }
        
        /* 数据表格 */
        .table-section { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .table-section .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .table-section .top h3 { font-size: 16px; }
        .table-section .top input { padding: 5px 10px; border: 1px solid #ddd; border-radius: 5px; }
        .table-wrap { overflow-x: auto; max-height: 400px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f8f9fa; position: sticky; top: 0; z-index: 10; padding: 8px; text-align: left; border-bottom: 2px solid #eee; }
        td { padding: 6px 8px; border-bottom: 1px solid #f0f0f0; }
        tr:hover { background: #f5f7fa; }
        .sector-tag { background: #e3f2fd; color: #0d47a1; padding: 1px 6px; border-radius: 10px; font-size: 11px; }
    </style>
</head>

</div>

    // ---------- 渲染函数 ----------
    const last = data[data.length-1];
    document.getElementById('lastDate').textContent = last.date;

    // 概览卡片
    document.getElementById('limitUp').textContent = last.limitUp;
    document.getElementById('limitDown').textContent = last.limitDown;
    document.getElementById('newHigh').textContent = last.newHigh;
    document.getElementById('newLow').textContent = last.newLow;
    document.getElementById('volume').textContent = (last.volume/10000).toFixed(2) + '亿';
    const diff = last.newHigh - last.newLow;
    document.getElementById('diff').textContent = diff;

    // 板块排行
    function renderSector(data) {
        const container = document.getElementById('sectorRankList');
        const days = data.slice(-5);
        const rank = {};
        days.forEach(d => {
            if (d.s1Name) { rank[d.s1Name] = (rank[d.s1Name]||0) + d.s1New; }
            if (d.s2Name) { rank[d.s2Name] = (rank[d.s2Name]||0) + d.s2New; }
            if (d.s3Name) { rank[d.s3Name] = (rank[d.s3Name]||0) + d.s3New; }
        });
        const sorted = Object.entries(rank).sort((a,b)=>b[1]-a[1]).slice(0,5);
        container.innerHTML = sorted.map(([name, count], idx) => {
            const day = data[data.length-1];
            let subs = '';
            if (day.s1Name === name && day.s1b1Name) {
                subs = `<div class="sub"><span>${day.s1b1Name} ${day.s1b1New||''}</span>${day.s1b2Name ? `<span>${day.s1b2Name} ${day.s1b2New||''}</span>` : ''}</div>`;
            } else if (day.s2Name === name && day.s2b1Name) {
                subs = `<div class="sub"><span>${day.s2b1Name} ${day.s2b1New||''}</span>${day.s2b2Name ? `<span>${day.s2b2Name} ${day.s2b2New||''}</span>` : ''}</div>`;
            } else if (day.s3Name === name && day.s3b1Name) {
                subs = `<div class="sub"><span>${day.s3b1Name} ${day.s3b1New||''}</span>${day.s3b2Name ? `<span>${day.s3b2Name} ${day.s3b2New||''}</span>` : ''}</div>`;
            }
            return `<div class="rank-item"><div class="name">${idx+1}. ${name} (${count})</div><div class="stats">近5日新高总数</div>${subs}</div>`;
        }).join('');
    }
    renderSector(data);

    // 趋势图
    function renderChart(data) {
        const canvas = document.getElementById('trendChart');
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        ctx.scale(dpr, dpr);

        const values = data.map(d => d.newHigh - d.newLow);
        const len = values.length;
        const pad = { top: 20, bottom: 30, left: 40, right: 20 };
        const w = rect.width - pad.left - pad.right;
        const h = rect.height - pad.top - pad.bottom;
        const min = Math.min(...values);
        const max = Math.max(...values);
        const range = max - min || 1;

        ctx.clearRect(0, 0, rect.width, rect.height);
        ctx.beginPath();
        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = 2;
        values.forEach((v, i) => {
            const x = pad.left + (i/(len-1)) * w;
            const y = pad.top + h - ((v - min)/range) * h;
            i===0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.stroke();

        // 参考线
        [200, 50, -50].forEach(level => {
            if (level > max || level < min) return;
            const y = pad.top + h - ((level - min)/range) * h;
            ctx.beginPath();
            ctx.strokeStyle = '#aaa';
            ctx.setLineDash([4,4]);
            ctx.lineWidth = 1;
            ctx.moveTo(pad.left, y);
            ctx.lineTo(pad.left + w, y);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#888';
            ctx.font = '10px sans-serif';
            ctx.fillText(level, pad.left - 25, y+4);
        });
    }

    // 表格
    function renderTable(data, filter='') {
        const tbody = document.getElementById('tableBody');
        const filtered = filter ? data.filter(d => d.date.includes(filter)) : data;
        tbody.innerHTML = filtered.slice().reverse().map(d => {
            const diff = d.newHigh - d.newLow;
            return `<tr>
                <td>${d.date}</td>
                <td>${(d.volume/10000).toFixed(2)}亿</td>
                <td>${d.limitUp}</td>
                <td>${d.limitDown}</td>
                <td>${d.bomb}</td>
                <td>${d.chain}</td>
                <td>${d.newHigh}</td>
                <td>${d.newLow}</td>
                <td style="font-weight:bold;color:${diff>0?'#e74c3c':'#27ae60'}">${diff}</td>
                <td>${d.s1Name || ''} ${d.s2Name ? ', '+d.s2Name : ''}</td>
            </tr>`;
        }).join('');
    }
    renderTable(data);

    // 筛选
    document.getElementById('filterDate').addEventListener('input', function() {
        renderTable(data, this.value);
    });

    // 窗口变化重绘图表
    window.addEventListener('resize', () => renderChart(data));
    setTimeout(() => renderChart(data), 100);
</script>
