      for (var j = winStart; j <= winEnd; j++) {
        if (j === idx) continue;
        var v = records[j][field];
        if (v >= records[idx][field]) isHigh = false;
        if (v <= records[idx][field]) isLow = false;
      }
      if (isHigh) records[idx]._flag[field + "_high"] = true;
      if (isLow) records[idx]._flag[field + "_low"] = true;
    })(i, "difference");
  }
  return records;
}

function refreshAll() {
  var records = buildRecords();
  records = computeStatuses(records);
  records = markExtremes(records);
  cachedRecords = records;
  renderTable(records);
  renderStats(records);
  renderCharts(records);
}

function renderTable(records) {
  var tbody = document.querySelector("#data-table tbody");
  var n = records.length;
  var html = "";
  for (var i = 0; i < n; i++) {
    var r = records[i];
    var flags = r._flag || {};
    function cellClass(fld) {
      if (flags[fld + "_high"]) return " cell-high";
      if (flags[fld + "_low"]) return " cell-low";
      return "";
    }
    html += "<tr class=\"" + r.statusClass + "\">";
    html += "<td>" + r.date + "</td>";
    html += "<td" + cellClass("volume") + ">" + (r.volume > 0 ? r.volume.toLocaleString() : "-") + "</td>";
    html += "<td>" + r.limitUp + "</td>";
    html += "<td>" + r.limitDown + "</td>";
    html += "<td>" + r.bomb + "</td>";
    html += "<td" + cellClass("sealRate") + ">" + r.sealRate.toFixed(1) + "%</td>";
    html += "<td>" + r.chain + "</td>";
    html += "<td>" + r.newHigh + "</td>";
    html += "<td>" + r.newLow + "</td>";
    html += "<td" + cellClass("difference") + ">" + r.difference + "</td>";
    html += "<td>" + r.newHighDaily + "</td>";
    html += "<td>" + r.sectorName + "</td>";
    html += "<td><span class=\"badge " + r.badgeClass + "\">" + r.statusLabel + "</span></td>";
    html += "</tr>";
  }
  tbody.innerHTML = html;
}

function renderStats(records) {
  if (records.length === 0) return;
  var latest = records[0];
  var volStr = latest.volume > 0 ? (latest.volume / 100).toFixed(0) + "亿" : "-";
  var html = "";
  html += "<div class=\"stat-card today\"><div class=\"stat-val\"><span class=\"badge " + latest.badgeClass + "\" style=\"font-size:18px\">" + latest.statusLabel + "</span></div><div class=\"stat-label\">最新状态 (" + latest.date + ")</div></div>";
  html += "<div class=\"stat-card\"><div class=\"stat-val\">" + volStr + "</div><div class=\"stat-label\">成交额(亿)</div></div>";
  html += "<div class=\"stat-card\"><div class=\"stat-val\" style=\"color:#fbbf24\">" + latest.limitUp + "</div><div class=\"stat-label\">涨停</div></div>";
  html += "<div class=\"stat-card\"><div class=\"stat-val\" style=\"color:#ef4444\">" + latest.limitDown + "</div><div class=\"stat-label\">跌停</div></div>";
  html += "<div class=\"stat-card\"><div class=\"stat-val\" style=\"color:#3b82f6\">" + latest.sealRate.toFixed(1) + "%</div><div class=\"stat-label\">封板率</div></div>";
  html += "<div class=\"stat-card\"><div class=\"stat-val\">" + latest.newHigh + "</div><div class=\"stat-label\">百日新高</div></div>";
  html += "<div class=\"stat-card\"><div class=\"stat-val\">" + latest.difference + "</div><div class=\"stat-label\">差值</div></div>";
  document.getElementById("stats-row").innerHTML = html;
}

var chartInstances = {};
function renderCharts(records) {
  var reversed = records.slice().reverse();
  var labels = [];
  for (var i = 0; i < reversed.length; i++) labels.push(reversed[i].date);

  function makeChart(canvasId, config) {
    if (chartInstances[canvasId]) chartInstances[canvasId].destroy();
    var ctx = document.getElementById(canvasId).getContext("2d");
    chartInstances[canvasId] = new Chart(ctx, config);
  }

  var volData = [];
  for (var i = 0; i < reversed.length; i++) volData.push(reversed[i].volume);
  var ma5 = [];
  for (var i = 0; i < volData.length; i++) {
    var start = Math.max(0, i - 4);
    var cnt = 0, sum = 0;
    for (var k = start; k <= i; k++) {
      if (volData[k] > 0) { sum += volData[k]; cnt++; }
    }
    ma5.push(cnt > 0 ? (sum / cnt) : null);
  }
  var volPlot = [];
  for (var i = 0; i < volData.length; i++) volPlot.push(volData[i] > 0 ? (volData[i] / 100).toFixed(0) : null);
  var ma5Plot = [];
  for (var i = 0; i < ma5.length; i++) ma5Plot.push(ma5[i] !== null ? (ma5[i] / 100).toFixed(1) : null);

  makeChart("chart-volume", {
    type: "line",
    data: {
      labels: labels,
      datasets: [
        { label: "成交额(亿)", data: volPlot, borderColor: "#3b82f6", backgroundColor: "rgba(59,130,246,0.1)", fill: true, tension: 0.3, pointRadius: 1 },
        { label: "5日均线", data: ma5Plot, borderColor: "rgba(251,191,36,0.8)", borderWidth: 2, pointRadius: 0, tension: 0.3 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { color: "#94a3b8", font: { size: 11 } } } },
      scales: {
        x: { ticks: { color: "#666", maxRotation: 45, autoSkip: true, maxTicksLimit: 20, font: { size: 10 } }, grid: { color: "#1f2235" } },
        y: { ticks: { color: "#666", font: { size: 10 } }, grid: { color: "#1f2235" } }
      }
    }
  });

  var limitUpData = [], limitDownNeg = [];
  for (var i = 0; i < reversed.length; i++) {
    limitUpData.push(reversed[i].limitUp);
    limitDownNeg.push(-reversed[i].limitDown);
  }
  makeChart("chart-limit", {
    type: "bar",
    data: {
      labels: labels,
      datasets: [
        { label: "涨停", data: limitUpData, backgroundColor: "rgba(251,191,36,0.7)", borderColor: "#fbbf24", borderWidth: 1, order: 2 },
        { label: "跌停", data: limitDownNeg, backgroundColor: "rgba(239,68,68,0.7)", borderColor: "#ef4444", borderWidth: 1, order: 2 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { color: "#94a3b8", font: { size: 11 } } } },
      scales: {
        x: { ticks: { color: "#666", maxRotation: 45, autoSkip: true, maxTicksLimit: 20, font: { size: 10 } }, grid: { color: "#1f2235" } },
        y: { ticks: { color: "#666", font: { size: 10 } }, grid: { color: "#1f2235" } }
      }
    }
  });

  var newHighData = [], newLowData = [], diffData = [];
  for (var i = 0; i < reversed.length; i++) {
    newHighData.push(reversed[i].newHigh);
    newLowData.push(reversed[i].newLow);
    diffData.push(reversed[i].difference);
  }
  makeChart("chart-hl", {
    type: "line",
    data: {
      labels: labels,
      datasets: [
        { label: "百日新高", data: newHighData, borderColor: "#fbbf24", backgroundColor: "rgba(251,191,36,0.1)", fill: false, tension: 0.3, pointRadius: 1, yAxisID: "y" },
        { label: "百日新低", data: newLowData, borderColor: "#60a5fa", backgroundColor: "rgba(96,165,250,0.1)", fill: false, tension: 0.3, pointRadius: 1, yAxisID: "y" },
        { label: "差值", data: diffData, borderColor: "#a78bfa", borderWidth: 2, borderDash: [5, 3], fill: false, tension: 0.3, pointRadius: 2, yAxisID: "y1" }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { color: "#94a3b8", font: { size: 11 } } } },
      scales: {
        x: { ticks: { color: "#666", maxRotation: 45, autoSkip: true, maxTicksLimit: 20, font: { size: 10 } }, grid: { color: "#1f2235" } },
        y: { type: "linear", position: "left", ticks: { color: "#666", font: { size: 10 } }, grid: { color: "#1f2235" } },
        y1: { type: "linear", position: "right", ticks: { color: "#a78bfa", font: { size: 10 } }, grid: { drawOnChartArea: false } }
      }
    }
  });

  var sealData = [];
  for (var i = 0; i < reversed.length; i++) sealData.push(reversed[i].sealRate);
  makeChart("chart-seal", {
    type: "line",
    data: {
      labels: labels,
      datasets: [
        { label: "封板率(%)", data: sealData, borderColor: "#34d399", backgroundColor: "rgba(52,211,153,0.15)", fill: true, tension: 0.3, pointRadius: 2, borderWidth: 2 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { color: "#94a3b8", font: { size: 11 } } } },
      scales: {
        x: { ticks: { color: "#666", maxRotation: 45, autoSkip: true, maxTicksLimit: 20, font: { size: 10 } }, grid: { color: "#1f2235" } },
        y: { min: 0, max: 100, ticks: { color: "#666", font: { size: 10 }, stepSize: 10 }, grid: { color: "#1f2235" } }
      }
    }
  });
}

function addData() {
  var input = document.getElementById("data-input").value.trim();
  var msg = document.getElementById("input-msg");
  if (!input) { msg.textContent = "请先粘贴数据"; msg.style.color = "#ef4444"; return; }

  var parts = input.split(/[\s,\uff0c\t]+/);
  if (parts.length < 10) { msg.textContent = "数据不完整，需要10个字段"; msg.style.color = "#ef4444"; return; }

  var date = parts[0];
  var volume = parseInt(parts[1]) || 0;
  var limitUp = parseInt(parts[2]) || 0;
  var limitDown = parseInt(parts[3]) || 0;
  var chain = parseInt(parts[4]) || 0;
  var bomb = parseInt(parts[5]) || 0;
  var newHigh = parseInt(parts[6]) || 0;
  var newLow = parseInt(parts[7]) || 0;
  var newHighDaily = parseInt(parts[8]) || 0;
  var sectorName = parts[9] || "";

  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { msg.textContent = "日期格式不正确，请使用 YYYY-MM-DD"; msg.style.color = "#ef4444"; return; }

  var local = loadLocal();
  var exists = -1;
  for (var i = 0; i < local.length; i++) {
    if (local[i][0] === date) { exists = i; break; }
  }
  if (exists >= 0) {
    local[exists] = [date, volume, limitUp, limitDown, chain, bomb, newHigh, newLow, newHighDaily, sectorName];
    msg.textContent = "已更新 " + date + " 的数据";
  } else {
    local.push([date, volume, limitUp, limitDown, chain, bomb, newHigh, newLow, newHighDaily, sectorName]);
    msg.textContent = "已添加 " + date + " 的数据";
  }
  saveLocal(local);
  document.getElementById("data-input").value = "";
  msg.style.color = "#86efac";
  cachedRecords = null;
  refreshAll();
}

function clearLocal() {
  localStorage.removeItem(LS_KEY);
  document.getElementById("data-input").value = "";
  document.getElementById("input-msg").textContent = "本地新增数据已清空";
  document.getElementById("input-msg").style.color = "#94a3b8";
  cachedRecords = null;
  refreshAll();
}

function loadCSV() {
  return fetch("./market_log.csv").then(function(r) {
    if (!r.ok) throw new Error("CSV not found");
    return r.text();
  }).then(function(txt) {
    var lines = txt.trim().split(/\r?\n/);
    var data = [];
    for (var i = 1; i < lines.length; i++) {
      var parts = lines[i].split(",");
      if (parts.length < 10) continue;
      data.push([parts[0], parseInt(parts[1])||0, parseInt(parts[2])||0, parseInt(parts[3])||0, parseInt(parts[4])||0, parseInt(parts[5])||0, parseInt(parts[6])||0, parseInt(parts[7])||0, parseInt(parts[8])||0, parts[9]||""]);
    }
    return data;
  });
}

function mergeCSV(csvData) {
  var map = {};
  for (var i = 0; i < EMBEDDED.length; i++) map[EMBEDDED[i][0]] = EMBEDDED[i];
  for (var i = 0; i < csvData.length; i++) map[csvData[i][0]] = csvData[i];
  var merged = [];
  for (var k in map) if (map.hasOwnProperty(k)) merged.push(map[k]);
  return sortByDate(merged);
}

var ALL_DATA = EMBEDDED;
function getAllData() {
  var local = loadLocal();
  return local.concat(ALL_DATA);
}
function getSourceLabel() {
  if (csvLoaded) return "market_log.csv";
  var hasLocal = loadLocal().length > 0;
  return hasLocal ? "内置+" + loadLocal().length + "条本地" : "内置131条";
}

window.addEventListener("DOMContentLoaded", function() {
  var msg = document.getElementById("input-msg");
  loadCSV().then(function(csvData) {
    ALL_DATA = mergeCSV(csvData);
    csvLoaded = true;
    var extra = csvData.length - EMBEDDED.length;
    msg.textContent = "CSV加载成功 (" + csvData.length + "条, +" + Math.max(0, extra) + "条新增)";
    msg.style.color = "#86efac";
    refreshAll();
  }).catch(function() {
    msg.textContent = "未找到market_log.csv, 使用内置131条数据";
    msg.style.color = "#94a3b8";
    refreshAll();
  });
  document.getElementById("data-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter") addData();
  });
});
</script>
