function fixData() {
  var btn = document.getElementById('fixBtn');
  var status = document.getElementById('status');
  btn.disabled = true;
  btn.textContent = '修复中...';

  var STORAGE_KEY = 'astock_dashboard_v3';
  var existing = [];
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) existing = JSON.parse(raw);
  } catch(e) { existing = []; }

  // 合并：新数据不覆盖已有数据
  var existingDates = {};
  existing.forEach(function(r) { existingDates[r.date] = r; });

  var added = 0, skipped = 0;
  GAP_DATA.forEach(function(r) {
    if (!existingDates[r.date]) {
      existing.push(r);
      added++;
    } else {
      skipped++;
    }
  });

  // 按日期排序
  existing.sort(function(a,b) { return a.date.localeCompare(b.date); });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(existing));

  status.style.display = 'block';
  status.style.background = '#d1fae5';
  status.style.color = '#059669';
  status.innerHTML = '<b>修复完成!</b><br>新增 ' + added + ' 条, 跳过 ' + skipped + ' 条(已存在)<br>总计 ' + existing.length + ' 条记录<br><br><a href="/A股市场情绪综合看板17.html" style="color:#2563eb;">→ 打开看板</a>';

  btn.style.display = 'none';
}
